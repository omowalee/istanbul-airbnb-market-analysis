version: 2

models:
  - name: int_active_short_term_listings
    description: "5 analiz havuzu kuralını sağlayan aktif kısa dönem kiralık ilanlar (Haziran 2026 için 14.886 ilan). Merkeze uzaklık bandı, host segmenti, puan grubu ve detaylı izin/lisans durumu kolonlarını içerir."
    columns:
      - name: listing_snapshot_id
        description: "Tekil satır anahtarı (listing_id + snapshot_date)."
        tests:
          - unique
          - not_null
      - name: listing_id
        tests:
          - not_null
      - name: room_type
        tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room']
      - name: center_distance_band
        tests:
          - not_null
      - name: host_segment
        tests:
          - not_null
      - name: rating_group
        tests:
          - not_null
      - name: license_status
        tests:
          - not_null

  - name: int_listing_calendar_window
    description: "Her (snapshot_date, listing_id) için takvim penceresi uzunluğunu (3/6/9/12 ay), kendi açık penceresi içindeki kapalı gün oranını ve dinamik minimum gece davranışını hesaplar."
    columns:
      - name: listing_snapshot_id
        tests:
          - not_null
      - name: calendar_window_bucket
        tests:
          - not_null

  - name: int_listing_amenity_flags
    description: "Her (snapshot_date, listing_id) için amenities JSON dizisinden manzara (su, şehir silüeti), konfor (mutfak, asansör, klima, çalışma alanı) ve otel benzeri birim (is_hotel_like_unit) bayraklarını çıkarır."
    columns:
      - name: listing_snapshot_id
        tests:
          - unique
          - not_null
      - name: view_category
        tests:
          - not_null

  - name: int_listing_history
    description: "Her listing_id'nin 4 snapshot boyunca görünürlüğünü, Eylül 2025 -> Haziran 2026 churn / uzun döneme geçiş durumunu ve Mart -> Haziran 2026 fiyat değişim davranışını özetler."
    columns:
      - name: listing_id
        tests:
          - unique
          - not_null

  - name: int_host_portfolio
    description: "Aktif kısa dönem havuzundaki ilanları (snapshot_date, host_id) düzeyinde özetleyerek portföy büyüklüğü, semt/lisans çeşitliliği ve toplam/ilan başı gelir metriklerini üretir."
    columns:
      - name: host_snapshot_id
        tests:
          - unique
          - not_null
      - name: host_id
        tests:
          - not_null
